<svg viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="AdsWire">
  <rect width="200" height="60" fill="#0A0A0A"/>
  <!-- Mark: scale(0.5) centred vertically — 50×50 in 60px height (5px margin) -->
  <g transform="translate(5,5) scale(0.5)">
    <path fill-rule="evenodd"
      d="M50,10 L18,90 L26,90 L50,28 L74,90 L82,90 Z
         M50,26 L22,88 L78,88 Z"
      fill="#2563EB"/>
    <rect x="24" y="68" width="52" height="8" fill="#2563EB"/>
    <circle cx="88"  cy="68" r="4"   fill="#2563EB" opacity="1"/>
    <circle cx="96"  cy="68" r="3.5" fill="#2563EB" opacity="0.55"/>
    <circle cx="104" cy="68" r="3"   fill="#2563EB" opacity="0.25"/>
    <circle cx="12"  cy="68" r="4"   fill="#2563EB" opacity="1"/>
    <circle cx="4"   cy="68" r="3.5" fill="#2563EB" opacity="0.55"/>
    <circle cx="-4"  cy="68" r="3"   fill="#2563EB" opacity="0.25"/>
  </g>
  <!-- Wordmark — JetBrains Mono, all caps, letter-spacing 0.12em -->
  <!-- x=68 starts after mark (scale 0.5: rightmost dot at 104*0.5+5=57px) -->
  <text x="68" y="38"
    font-family="'JetBrains Mono', monospace"
    font-size="21" font-weight="700"
    fill="#E8E8E8" letter-spacing="0.12em">ADSWIRE</text>
</svg>
